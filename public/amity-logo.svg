<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147" />
      <stop offset="100%" stop-color="#001530" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <g filter="url(#dropShadow)">
    <!-- Left Blue Shield Half -->
    <path d="M200 40 L50 90 C50 250, 150 340, 200 380 Z" fill="url(#blueGradient)" />
    <!-- Right Gold Shield Half -->
    <path d="M200 40 L350 90 C350 250, 250 340, 200 380 Z" fill="url(#goldGradient)" />
    
    <!-- Inner border -->
    <path d="M200 60 L70 105 C70 240, 160 315, 200 350 C240 315, 330 240, 330 105 Z" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8" />
  </g>
  
  <!-- The A -->
  <text x="200" y="270" font-family="Georgia, serif" font-size="180" font-weight="bold" text-anchor="middle" fill="#FFFFFF">A</text>
  
  <!-- Stars -->
  <path d="M200 80 l8 25 h25 l-20 15 l8 25 l-21 -16 l-21 16 l8 -25 l-20 -15 h25 z" fill="#FFFFFF" opacity="0.9" />
  <path d="M120 120 l5 15 h15 l-12 9 l5 15 l-13 -10 l-13 10 l5 -15 l-12 -9 h15 z" fill="#FFFFFF" opacity="0.9" />
  <path d="M280 120 l5 15 h15 l-12 9 l5 15 l-13 -10 l-13 10 l5 -15 l-12 -9 h15 z" fill="#FFFFFF" opacity="0.9" />
</svg>
